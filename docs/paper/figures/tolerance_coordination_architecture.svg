<text x="57" y="310" class="heading">Observed state</text>
<text x="57" y="341" class="body">State estimates + histories</text>
<text x="57" y="367" class="body">Path projection / validity</text>
<text x="57" y="393" class="body">No true disturbance labels</text>
<rect class="box" x="350" y="280" width="300" height="160" fill="#f4f7fa" stroke="#64748b"/>
<text x="367" y="310" class="heading">Task feasibility proxy</text>
<text x="367" y="341" class="body">6 m execution-path preview</text>
<text x="367" y="367" class="body">κ_max = max |curvature|</text>
<text x="367" y="393" class="body">Candidate v² κ_max ≤ 3 m/s²</text>
<text x="367" y="419" class="body">No road-boundary test</text>
<rect class="box" x="700" y="280" width="700" height="160" fill="#e9f3fb" stroke="#0072B2"/>
<text x="717" y="310" class="heading">Frozen full-state q · prior ensemble</text>
<text x="717" y="341" class="body">41 → 16 → 16 → 1, ReLU; sigmoid probabilities; 3 seeds</text>
<text x="717" y="367" class="body">34 native state features + 7 candidate / disturbance-query inputs</text>
<text x="717" y="393" class="body">Hypotheses: world Fy = ±64 N, duration 0.1 s, prep = 0.2 / 0.6 s</text>
<text x="717" y="419" class="body">Mean probabilities across seeds, THEN min across 4 hypotheses</text>
<rect class="box" x="40" y="500" width="260" height="230" fill="#eff7f3" stroke="#347c63"/>
<text x="57" y="530" class="heading">One-shot Dubins rejoin</text>
<text x="57" y="561" class="body">Deterministic, radius 1.8 m</text>
<text x="57" y="587" class="body">Checks at task 1…9 s</text>
<text x="57" y="613" class="body">If |cross-track| &gt; 1 m</text>
<text x="57" y="639" class="body">or follower invalid, once</text>
<text x="57" y="665" class="body">Current pose → original goal</text>
<text x="57" y="691" class="body">Execution path only; no NN</text>
<rect class="box" x="350" y="500" width="700" height="280" fill="#fff6e8" stroke="#b87c21"/>
<text x="367" y="530" class="heading">Nonlearned coordinator · 50 Hz</text>
<text x="367" y="561" class="body">User candidate first: task proxy + q ≥ 0.8 (0.85 while latched)</text>
<text x="367" y="587" class="body">Otherwise: jointly eligible candidates minimize fixed proxy cost</text>
<text x="367" y="613" class="body">w_v = 0.1 + 0.9α_user;  w_δ = 1 − 0.9α_user</text>
<text x="367" y="639" class="body">Preference / switch penalties: 0.05(α−α_user)² + 0.02(α−α_prev)²</text>
<text x="367" y="665" class="body">No joint-eligible: task-feasible user first; else minimum proxy cost</text>
<text x="367" y="691" class="body">Cost ties: lower index; none task-feasible → α = 0.5</text>
<text x="367" y="717" class="body">This fallback remains DEGRADED; it does not clear the risk latch</text>
<text x="367" y="743" class="body">Publication permission off: hold previous α and latch</text>
