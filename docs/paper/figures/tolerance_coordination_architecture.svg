<text x="57" y="198" class="body">Fixed α_user ∈ {0, 0.5, 1}</text>
<rect class="box" x="350" y="85" width="300" height="130" fill="#f4f7fa" stroke="#64748b"/>
<text x="367" y="115" class="heading">Geometric follower</text>
<text x="367" y="146" class="body">Current execution path</text>
<text x="367" y="172" class="body">+ pose / projection</text>
<text x="367" y="198" class="body">→ nominal (v_nom, δ_nom)</text>
