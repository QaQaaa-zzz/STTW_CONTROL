<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1030" viewBox="0 0 1440 1030" role="img" aria-labelledby="title desc">
<title id="title">Implemented frozen H75 tolerance coordination architecture</title>
<desc id="desc">Fixed original path, goal and one of three user preferences feed a geometric follower and three frozen H75 candidate queries at fifty hertz. A frozen three-seed forty-one-input tolerance network averages sigmoid probabilities per hypothetical disturbance query, then takes the minimum across four hypotheses. A nonlearned coordinator combines a six-metre execution-path curvature proxy, user priority, risk thresholds, latch and publication permission. Its current guard-equivalent degraded fallback selects the requested user candidate when task-feasible, otherwise the minimum-proxy-cost task-feasible candidate; it does not clear the risk latch. Earlier max-q prototype experiments are separately identified in the manuscript. The selected reference passes unchanged native bounds, filtering and slew limits into the frozen local300 residual with ECBC and ESO at two hundred hertz. Measured state closes the loop. A deterministic one-shot Dubins reconnection changes only the execution path while retaining the original goal. Hypothetical forces are not measured external disturbances and no safety guarantee is asserted.</desc>
<metadata>Repo-native editable SVG. Sources: learning/src/sttw_control/tolerance_coordination.py, native_goal_run.py, native_goal_continuation.py, goal_replanning.py. Current guard-equivalent degraded fallback implementation: 2c96647; earlier max-q prototype: 1b139d7; unchanged frozen prior_rank_last three-seed ensemble. No generated raster asset, new physics, or training.</metadata>
