name: Test and publish geometric reward contract
on:
  push:
    branches: ["delivery/geometric-reward-contract"]
permissions:
  contents: write
concurrency:
  group: geometric-reward-delivery
  cancel-in-progress: false
jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JAX_PLATFORMS: cpu
      STTW_TEST_MJX_CPU: '1'
      MUJOCO_GL: osmesa
      PYTHONPATH: learning/src
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      BASE_SHA: f8506ea99da938ea2b517e9dd52b393cb797675d
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare exact source without changing target branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reward-delivery"
          cp .github/reward-delivery/* "$RUNNER_TEMP/reward-delivery/"
          python - <<'PY'
          import os, pathlib, base64, lzma, json, hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'reward-delivery'
          manifest=json.loads((root/'manifest.json').read_text())
          assert manifest['base_commit']==os.environ['BASE_SHA']
          data=''.join((root/f'{i:02d}.b64').read_text() for i in range(4))
          patch=lzma.decompress(base64.b64decode(data,validate=True))
          assert hashlib.sha256(patch).hexdigest()==manifest['patch_sha256']
          (root/'change.patch').write_bytes(patch)
          PY
          git fetch origin feat/residual-recovery
          test "$(git rev-parse FETCH_HEAD)" = "$BASE_SHA"
          git switch --detach "$BASE_SHA"
          git apply --index --check "$RUNNER_TEMP/reward-delivery/change.patch"
          git apply --index "$RUNNER_TEMP/reward-delivery/change.patch"
          git diff --cached --check
          python - <<'PY'
          import os, pathlib, json, hashlib, subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'reward-delivery'
          m=json.loads((root/'manifest.json').read_text())
          for path,expected in m['files'].items():
              assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()==expected, path
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert paths and all(p.startswith(('learning/','docs/')) or p=='PROJECT.md' for p in paths)
          assert '.github' not in subprocess.check_output(['git','diff','--cached','--name-only'],text=True)
          PY
          git config user.name 'STTW code assistant'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          TREE=$(git write-tree)
          COMMIT=$(printf '%s\n' 'fix: separate geometric path and speed rewards; remove recovery gaming' | git commit-tree "$TREE" -p "$BASE_SHA")
          git switch --detach "$COMMIT"
          mkdir -p test-output
          git archive --format=tar.gz --output=test-output/source.tar.gz HEAD
          git rev-parse HEAD > test-output/commit.txt
          cp "$RUNNER_TEMP/reward-delivery/manifest.json" test-output/
          git diff "$BASE_SHA" HEAD --stat > test-output/diff-stat.txt
      - name: Install CPU integration dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libosmesa6 libegl1 libgl1 libeigen3-dev ffmpeg
          python -m pip install 'mujoco==3.6.0' 'mujoco-mjx==3.6.0' 'jax[cpu]==0.6.2' 'flax==0.10.7' 'optax==0.2.5'
          python -m pip install -e './learning[test,media]'
          python -m pip freeze > test-output/dependencies.txt
      - name: Test exact proposed commit, no formal training
        run: python -m pytest learning/tests -q --junitxml=test-output/pytest.xml
      - name: Publish tested code only by fast-forward
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/residual-recovery
          test "$(git rev-parse FETCH_HEAD)" = "$BASE_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test -z "$(git diff "$BASE_SHA" HEAD -- .github)"
          git push origin HEAD:refs/heads/feat/residual-recovery
          printf '{"published_commit":"%s","branch":"feat/residual-recovery","tests_passed":true}\n' "$(git rev-parse HEAD)" > test-output/publication.json
      - name: Upload source, tests and publication provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geometric-reward-tested-delivery
          path: test-output
          retention-days: 7
