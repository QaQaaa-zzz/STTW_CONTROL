name: Learning regression tests
on:
  push:
    branches: ["agent/alpha-path-tracking", "feat/residual-recovery"]
    paths: ["learning/**", ".github/**"]
permissions:
  contents: write
concurrency:
  group: learning-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JAX_PLATFORMS: cpu
      STTW_TEST_MJX_CPU: '1'
      MUJOCO_GL: osmesa
      PYTHONPATH: learning/src
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply reviewed patch on staging branch only
        if: github.ref == 'refs/heads/agent/alpha-path-tracking'
        run: |
          if test -f .github/pending-tracking.patch; then
            git show f18376528b32547c2bad5667bee74125ecff884f:.github/workflows/learning-tests.yml > .github/workflows/learning-tests.yml
            cat .github/tracking-patch-parts/*.patch .github/pending-tracking.patch > /tmp/tracking-changes.patch
            git apply --check /tmp/tracking-changes.patch
            git apply /tmp/tracking-changes.patch
            if test -f .github/tracking-fixup.patch; then
              git apply --check .github/tracking-fixup.patch
              git apply .github/tracking-fixup.patch
              git rm .github/tracking-fixup.patch
            fi
            git rm .github/pending-tracking.patch .github/tracking-patch-parts/*.patch
            git add learning PROJECT.md docs AGENTS.md .github/workflows/learning-tests.yml
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: alpha-conditioned geometric path recovery'
          fi
      - name: Archive exact tested sources
        run: |
          mkdir -p test-output
          git archive --format=tar.gz --output=test-output/source.tar.gz HEAD
          git rev-parse HEAD > test-output/commit.txt
      - name: Upload source provenance
        uses: actions/upload-artifact@v4
        with:
          name: tested-source
          path: |
            test-output/source.tar.gz
            test-output/commit.txt
          retention-days: 3
      - name: Install CPU test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libosmesa6 libegl1 libgl1 libeigen3-dev ffmpeg
          python -m pip install 'mujoco==3.6.0' 'mujoco-mjx==3.6.0' 'jax[cpu]==0.6.2' 'flax==0.10.7' 'optax==0.2.5'
          python -m pip install -e './learning[test,media]'
          python -m pip freeze > test-output/dependencies.txt
      - name: Run learning tests without GPU or long training
        run: python -m pytest learning/tests -q --junitxml=test-output/pytest.xml
      - name: Push tested staging commit only
        if: success() && github.ref == 'refs/heads/agent/alpha-path-tracking'
        run: git push origin HEAD:refs/heads/agent/alpha-path-tracking
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-test-results
          path: test-output
          retention-days: 7
