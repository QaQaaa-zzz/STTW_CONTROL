name: Learning regression tests
on:
  push:
    branches: ["agent/alpha-path-tracking", "feat/residual-recovery"]
    paths: ["learning/**", ".github/**"]
permissions:
  contents: read
concurrency:
  group: learning-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JAX_PLATFORMS: cpu
      STTW_TEST_MJX_CPU: '1'
      MUJOCO_GL: osmesa
      PYTHONPATH: learning/src
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Archive exact tested sources
        run: |
          mkdir -p test-output
          git archive --format=tar.gz --output=test-output/source.tar.gz HEAD
          git rev-parse HEAD > test-output/commit.txt
      - name: Upload source provenance
        uses: actions/upload-artifact@v4
        with:
          name: tested-source
          path: |
            test-output/source.tar.gz
            test-output/commit.txt
          retention-days: 3
      - name: Install CPU test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libosmesa6 libegl1 libgl1 libeigen3-dev ffmpeg
          python -m pip install 'mujoco==3.6.0' 'mujoco-mjx==3.6.0' 'jax[cpu]==0.6.2' 'flax==0.10.7' 'optax==0.2.5'
          python -m pip install -e './learning[test,media]'
          python -m pip freeze > test-output/dependencies.txt
      - name: Run learning tests without GPU or long training
        run: python -m pytest learning/tests -q --junitxml=test-output/pytest.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-test-results
          path: test-output
          retention-days: 7
