[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sttw-control"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "mujoco>=3.3", "mujoco-mjx>=3.3", "jax>=0.6", "flax>=0.10", "optax>=0.2"]

[project.optional-dependencies]
test = ["pytest>=8"]
media = ["matplotlib>=3.7", "mediapy>=1.2", "Pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]
